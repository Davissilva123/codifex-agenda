name: Keep Supabase Alive

on:
  schedule:
    # Roda a cada 4 dias às 00:00 UTC
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Permite que você rode manualmente se quiser testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
